<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Inline</title>
</head>

<body>
    <h1>Demonstração de CSS Inline</h1>
    <p style="color: blue; font-size: 24px;">Este parágrafo utiliza CSS inline atráves do atributo style</p>

    <p style="color: red; font-weight: bold; font-size: 24px; background-color: yellow;">Outro parágrafo com múltiplas
        propriedades CSS inline</p>

    <!-- padding: espaçamento interno / margin: espaçamento externo -->
    <div>
        <p style="border: 2px solid green; width: 400px; padding: 30px;">Esta é uma DIV utilizada com CSS inline</p>
    </div>
    <h2 style="text-align: center; color: #2e2e7a;">
        título centralizado com cor hexadecimal
    </h2>

    <div
        style="width: 600px; height: 400px; background-color: orange; color: white; front-size: 32px; text-align: center;">
        Desafio CSS inline
    </div>
</body>

</html>
